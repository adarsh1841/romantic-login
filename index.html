<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Romantic Login</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ffb6b9, #fcd5ce);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Floating hearts */
.heart {
    position: absolute;
    font-size: 18px;
    opacity: 0.4;
    animation: float 6s linear infinite;
}
@keyframes float {
    from { transform: translateY(110vh); }
    to   { transform: translateY(-10vh); }
}

.card {
    background: rgba(255,255,255,0.95);
    width: 520px;
    padding: 50px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 25px 50px rgba(0,0,0,0.25);
    z-index: 2;
}

h1 {
    font-family: 'Playfair Display', serif;
    color: #d6336c;
    font-size: 32px;
    margin-bottom: 10px;
}

.sub-text {
    color: #666;
    font-size: 18px;
    margin-bottom: 35px;
    height: 24px;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 30px;
}

.yes-btn {
    background: linear-gradient(135deg, #ff5d8f, #ff87ab);
    color: white;
    border: none;
    border-radius: 35px;
    padding: 16px 50px;
    font-size: 18px;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(255,93,143,0.5);
    transition: all 0.25s ease;
}

.yes-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 15px 30px rgba(255,93,143,0.7);
}

.no-btn {
    position: fixed;
    background: #f1f1f1;
    color: #555;
    border: none;
    border-radius: 35px;
    padding: 16px 45px;
    font-size: 18px;
    cursor: pointer;
    z-index: 3;
}
</style>
</head>
<body>

<!-- Floating hearts -->
<script>
for(let i=0;i<25;i++){
    const h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤";
    h.style.left=Math.random()*100+"vw";
    h.style.animationDuration=4+Math.random()*4+"s";
    document.body.appendChild(h);
}
</script>

<div class="card">
    <h1>Do you want to login? 💖</h1>
    <div class="sub-text" id="funText">Are you shy? 😘</div>

    <div class="buttons">
        <button class="yes-btn" onclick="goNext()">Yes</button>
    </div>
</div>

<button class="no-btn" id="noBtn">No</button>

<script>
const messages = [
    "Are you shy? 😘",
    "Don’t break my heart 💔",
    "Love says YES 💕",
    "Come on 😍",
    "You know you want to 😄"
];

const noBtn = document.getElementById("noBtn");
const funText = document.getElementById("funText");
let count = 0;

// Initial NO position (no movement on refresh)
window.onload = () => {
    noBtn.style.left = "58%";
    noBtn.style.top = "65%";
};

// Escape logic
document.addEventListener("mousemove", (e) => {
    const rect = noBtn.getBoundingClientRect();
    const distance = Math.hypot(
        e.clientX - (rect.left + rect.width / 2),
        e.clientY - (rect.top + rect.height / 2)
    );

    if (distance < 100) {
        funText.innerText = messages[count % messages.length];
        count++;

        const maxX = window.innerWidth - rect.width - 20;
        const maxY = window.innerHeight - rect.height - 20;

        noBtn.style.left = Math.random() * maxX + "px";
        noBtn.style.top  = Math.random() * maxY + "px";
    }
});

function goNext() {
    window.location.href = "gallery.html";
}
</script>

</body>
</html>
